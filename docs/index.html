<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a4524">
<title>Таверна</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top" hidden>
  <div class="wrap hrow">
    <div class="brand"><i>🍺</i><span>Таверна</span></div>
    <button class="icon" id="help" aria-label="Справка" title="Справка">?</button>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Раздел">
    <button data-tab="today"><b>🕯️</b>Сегодня<span class="cnt" id="cntDue" hidden>0</span></button>
    <button data-tab="lessons"><b>📜</b>Уроки</button>
    <button data-tab="words"><b>🗝️</b>Слова</button>
    <button data-tab="books"><b>📚</b>Книги</button>
  </nav>
</header>

<main class="wrap" id="main"><div class="empty"><b>Загружаю…</b></div></main>

<div id="sheet" class="sheet" hidden></div>
<div id="modalRoot"></div>
<input type="file" id="epub" accept=".epub,application/epub+zip" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
